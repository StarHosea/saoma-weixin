<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5f7">
    <title>liberty - 图片下载</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <main>
      <a class="image-link" href="../images/liberty.jpg" target="_blank" rel="noopener" aria-label="查看 liberty 原图">
        <img src="../images/liberty.jpg" alt="liberty 微信二维码" width="888" height="1140">
      </a>
      <a class="download-button" href="../images/liberty.jpg" download="liberty.jpg">下载图片</a>
    </main>
    <script>
      const download = document.querySelector(".download-button");
      fetch(download.href)
        .then((response) => response.ok ? response.blob() : Promise.reject())
        .then((blob) => {
          const objectUrl = URL.createObjectURL(blob);
          document.querySelector("img").src = objectUrl;
          download.href = objectUrl;
          addEventListener("pagehide", () => URL.revokeObjectURL(objectUrl), { once: true });
        })
        .catch(() => {});
    </script>
  </body>
</html>
