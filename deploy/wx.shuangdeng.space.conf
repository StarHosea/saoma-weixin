server {
    listen 80;
    listen [::]:80;
    server_name wx.shuangdeng.space;

    root /www/sites/wx.shuangdeng.space;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wx.shuangdeng.space;
    http2 on;

    root /www/sites/wx.shuangdeng.space;
    index index.html;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/wx.shuangdeng.space/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/wx.shuangdeng.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
